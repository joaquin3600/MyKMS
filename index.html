
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MyKMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- #region Theme initialization -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem("mykms-theme");
                const theme = savedTheme === "dark" ? "dark" : "light";

                document.documentElement.dataset.theme = theme;
            } catch {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>
    <!-- #endregion Theme initialization -->

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row">

            <aside class="col-md-3 col-lg-2 sidebar p-3">

                <div class="sidebar-header d-flex align-items-center justify-content-between mb-4">
                    <h5 class="mb-0">
                        <i class="bi bi-journal-bookmark"></i> MyKMS
                    </h5>

                    <button id="theme-toggle"
                            class="theme-toggle"
                            type="button"
                            aria-label="Switch to dark mode"
                            aria-pressed="false"
                            title="Change theme">

                        <i id="theme-toggle-icon"
                        class="bi bi-moon-stars"
                        aria-hidden="true"></i>

                    </button>
                </div>

                <input id="search"
                    class="form-control form-control-sm mb-3"
                    placeholder="Search..." />

                <nav id="navigation"></nav>
            </aside>


            <main class="col-md-9 col-lg-10 p-4 p-lg-5">

                <div class="row">

                    <!-- Main document -->
                    <div class="col-lg-9">

                        <div class="content-container">
                            <h1 id="title">Welcome</h1>

                            <hr>

                            <article id="content">
                                Select a document to get started.
                            </article>
                        </div>

                    </div>

                    <!-- Table of contents -->
                    <aside id="table-of-contents"
                        class="col-lg-3 toc-sidebar">

                        <h6>ON THIS PAGE</h6>

                        <nav id="toc-navigation"></nav>

                    </aside>

                </div>

            </main>


        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Application -->
    <script src="./app.js"></script>
</body>
</html>
