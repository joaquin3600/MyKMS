
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MyKMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Highlight.js - Light theme -->
    <link id="highlight-light"
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github.min.css"
        disabled>

    <!-- Highlight.js - Dark theme -->
    <link id="highlight-dark"
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github-dark.min.css">

    <!-- #region Theme initialization -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem("mykms-theme");
                const theme = savedTheme === "dark" ? "dark" : "light";

                document.documentElement.dataset.theme = theme;
            } catch {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>
    <!-- #endregion Theme initialization -->

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- #region Header -->

    <header class="app-header">

        <div class="header-left">

            <button id="sidebar-toggle"
                    class="sidebar-toggle"
                    type="button"
                    aria-label="Hide sidebar"
                    aria-expanded="true"
                    title="Toggle sidebar">

                <i class="bi bi-list" aria-hidden="true"></i>

            </button>

            <h5 class="app-title mb-0">
                <i class="bi bi-journal-bookmark"></i>
                MyKMS
            </h5>

        </div>

        <div class="header-right">

            <button id="export-pdf"
                    class="export-pdf"
                    type="button"
                    title="Export PDF"
                    aria-label="Export document as PDF">

                <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>
                <span>Export PDF</span>
            </button>

            <button id="collapse-h2-toggle"
                    class="collapse-h2-toggle"
                    type="button"
                    title="Collapse All (Ctrl + M)"
                    aria-label="Collapse all sections">
                <i class="bi bi-arrows-collapse"
                aria-hidden="true"></i>
            </button>

            <button id="focus-mode-toggle"
                    class="focus-mode-toggle"
                    type="button"
                    title="Focus Mode"
                    aria-label="Enter Focus Mode"
                    aria-pressed="false">

                <i id="focus-mode-icon"
                class="bi bi-arrows-angle-expand"
                aria-hidden="true"></i>

            </button>
            
            <button id="theme-toggle"
                    class="theme-toggle"
                    type="button"
                    aria-label="Switch to dark mode"
                    aria-pressed="false"
                    title="Change theme">

                <i id="theme-toggle-icon"
                class="bi bi-moon-stars"
                aria-hidden="true"></i>

            </button>

        </div>

    </header>

    <!-- #endregion Header -->
    <!-- Reading progress bar -->
    <div class="reading-progress"
        role="progressbar"
        aria-label="Reading progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0">

        <div id="reading-progress-bar"
            class="reading-progress-bar"></div>

    </div>

    <div class="container-fluid">
        <div class="row">

            <aside class="sidebar-column col-md-3 col-lg-2">

                <div class="sidebar-content p-3">

                    <input id="search"
                        class="form-control form-control-sm mb-3"
                        placeholder="Search..." />

                    <nav id="navigation"></nav>

                </div>

            </aside>

            <main class="col-md-9 col-lg-10 p-4 p-lg-5">

                <div class="row">

                    <!-- Main document -->
                    <div class="col-lg-9">

                        <div class="content-container">
                            <h1 id="title">Welcome</h1>

                                <nav id="breadcrumb"
                                    class="breadcrumb-container"
                                    aria-label="Breadcrumb">
                                </nav>

                            <hr>

                            <article id="content">
                                Select a document to get started.
                            </article>
                        </div>

                    </div>

                    <!-- Table of contents -->
                    <aside id="table-of-contents"
                        class="col-lg-3 toc-sidebar">

                        <h6>ON THIS PAGE</h6>

                        <nav id="toc-navigation"></nav>

                    </aside>

                </div>

            </main>


        </div>
    </div>


    <!-- Back to top button -->
    <button id="back-to-top"
            class="back-to-top"
            type="button"
            aria-label="Back to top"
            title="Back to top">

        <i class="bi bi-arrow-up" aria-hidden="true"></i>

    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>

    <!-- Application -->
    <script src="./app.js"></script>

</body>

</html>
